name: Build and Deploy to Hosstech

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Website
        run: npm run build

      - name: FTP Debug
        continue-on-error: true
        run: |
          echo "--- Port 21 erreichbar? ---"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.FTP_SERVER }}/21" \
            && echo "OK" || echo "BLOCKIERT"
          echo "--- PASV-Antwort ---"
          curl -v --ssl-reqd --ftp-pasv \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD
