name: Build and Deploy to Hosstech

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Website
        run: npm run build

      - name: FTP Debug
        continue-on-error: true
        run: |
          echo "--- Port 21 erreichbar? ---"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/${{ secrets.FTP_SERVER }}/21" \
            && echo "OK" || echo "BLOCKIERT"
          echo "--- PASV-Antwort ---"
          curl -v --ssl-reqd --ftp-pasv \
            --user "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" \
            "ftp://${{ secrets.FTP_SERVER }}/" 2>&1 | grep -Ev "PASS" | tail -40

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./build/
          server-dir: ./
          timeout: 60000
          log-level: verbose
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
